        params:
          method: activation
          ratio: 0.20

      - stage: finetune
        source: std_rgb96_pra20_ft10_pra20
        params:
          epochs: 10
          lr: 2.0e-4

      - stage: prune
        source: std_rgb96_pra20_ft10_pra20_ft10
        params:
          method: activation
          ratio: 0.20

      - stage: finetune
        source: std_rgb96_pra20_ft10_pra20_ft10_pra20
        params:
