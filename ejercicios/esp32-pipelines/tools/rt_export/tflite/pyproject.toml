[project]
name = "rt-export-tflite"
version = "0.1.0"
description = "Export de modelos .pth (esp32-cam) a TFLite full-integer int8 para firmware_rt/tflm"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow-cpu>=2.19,<2.20",
    "ai-edge-litert>=1.2",
    "onnx2tf>=1.26",
    "onnx>=1.16,<1.18",
    "onnxruntime>=1.18",
    "onnx-graphsurgeon>=0.5",
    "sng4onnx>=1.0",
    "onnxsim>=0.4",
    "psutil>=5.9",
    "flatbuffers>=24",
    "numpy>=1.26,<2.1",
    "torch>=2.4",
    "torchvision>=0.19",
    "tf-keras>=2.19.0",
]

[tool.uv]
# Solo linux (evita el corner case win32 de tensorflow-cpu al resolver).
environments = ["sys_platform == 'linux'"]
# torch CPU-only: no arrastrar CUDA al venv de export.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
