<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">

	<link rel="stylesheet" href="reveal.js-master/dist/reset.css">

	<!-- Custom Styling for Premium Look -->
	<style>
		:root {
			--r-main-font: 'Inter', sans-serif;
			--r-heading-font: 'Outfit', sans-serif;
			--r-main-font-size: 32px;
		}

		.reveal section img {
			border-radius: 12px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
		}

		.gradient-text {
			background: linear-gradient(45deg, #8be9fd, #bd93f9);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			font-weight: bold;
		}

		.diagram-header {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin-bottom: 1rem;
		}

		.diagram-header img {
			height: 150px !important;
			background: transparent !important;
			filter: invert(1);
			box-shadow: none !important;
			border-radius: 0 !important;
		}
	</style>

	<!-- Theme used for syntax highlighted code -->
	<link rel="stylesheet" href="reveal.js-master/plugin/highlight/monokai.css">

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@700&display=swap"
		rel="stylesheet">
</head>

<body>
	<div class="reveal">
		<div class="slides">

	<script src="reveal.js-master/dist/reveal.js"></script>
	<script src="reveal.js-master/plugin/notes/notes.js"></script>
	<script src="reveal.js-master/plugin/markdown/markdown.js"></script>
	<script src="reveal.js-master/plugin/highlight/highlight.js"></script>
	<script>
		Reveal.initialize({
			hash: true,
			controls: true,
			progress: true,
			center: true,
			slideNumber: 'c/t',
			transition: 'slide',
			dependencies: [
				{
					src: 'reveal_external/external/external.js',
					condition: function () {
						return !!document.querySelector('[data-external],[data-external-replace]');
					}
				}
			],
			plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
		});

		Reveal.on('ready', () => {
			document.querySelectorAll('section').forEach(s => {
				if (!s.hasAttribute('data-auto-animate')) {
					s.setAttribute('data-auto-animate', '');
				}
			});
		});
	</script>

</html>
